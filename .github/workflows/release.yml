name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-cmd: npm run dist
          - os: windows-latest
            dist-cmd: npm run dist:win
          - os: ubuntu-latest
            dist-cmd: npm run dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build
        run: ${{ matrix.dist-cmd }}

      - name: Smoke test packaged build (Linux, headless)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node e2e_packaged_test.js
        continue-on-error: true

      - name: Smoke test packaged build
        if: matrix.os != 'ubuntu-latest'
        run: node e2e_packaged_test.js
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
          fail_on_unmatched_files: false
